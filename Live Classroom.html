<!DOCTYPE html>
<html lang="en">
<head>
<!-- Prepared with AI support, reviewed by Mr. Johnson -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F5F9; --surface: #FFFFFF; --ink: #1D2B4F; --ink-soft: #55607A;
    --rule: #D5DCE8; --nb-line: #CBDAF0; --nb-margin: #E58C8C; --focus: #2F6FDE;
    --accent: #1D2B4F; --accent-ink: #FFFFFF;
    --ok: #2E7D4F; --ok-bg: #E2F3E8; --warn: #A4462F; --warn-bg: #FBE7E1;
    --idle: #7A5B0C; --idle-bg: #FBF0CF; --sub: #1F5FC4; --sub-bg: #E3ECFB;
    --frz: #5B3FA0; --frz-bg: #ECE6F8; --new: #FFF0A3;
    --lh: 2.15rem;
    color-scheme: light; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121726; --surface: #1A2135; --ink: #E6EAF4; --ink-soft: #A5AEC4;
      --rule: #2E3752; --nb-line: #2A3550; --nb-margin: #9A4B4B; --focus: #7FA8F5;
      --accent: #E6EAF4; --accent-ink: #121726;
      --ok: #8FD4A8; --ok-bg: #1E3528; --warn: #F0A592; --warn-bg: #3B2420;
      --idle: #EBCB78; --idle-bg: #3A3118; --sub: #9DBEF7; --sub-bg: #1E2C4A;
      --frz: #C3B2F0; --frz-bg: #2D2546; --new: #4A4220;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121726; --surface: #1A2135; --ink: #E6EAF4; --ink-soft: #A5AEC4;
    --rule: #2E3752; --nb-line: #2A3550; --nb-margin: #9A4B4B; --focus: #7FA8F5;
    --accent: #E6EAF4; --accent-ink: #121726;
    --ok: #8FD4A8; --ok-bg: #1E3528; --warn: #F0A592; --warn-bg: #3B2420;
    --idle: #EBCB78; --idle-bg: #3A3118; --sub: #9DBEF7; --sub-bg: #1E2C4A;
    --frz: #C3B2F0; --frz-bg: #2D2546; --new: #4A4220;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", -apple-system, Roboto, Arial, sans-serif;
    font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .shell { max-width: 900px; margin: 0 auto; padding: 22px 20px 56px; }
  body.wide .shell { max-width: 1240px; }

  header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { margin: 0; font-size: clamp(1.6rem, 3.6vw, 2.1rem); line-height: 1.15; }
  h2 { font-size: 1.35rem; margin: 0 0 6px; line-height: 1.2; }
  h3 { font-size: 1.02rem; margin: 0 0 8px; }
  .lede { margin: 4px 0 0; color: var(--ink-soft); font-size: 0.95rem; max-width: 60ch; }
  .attribution {
    font-size: 0.78rem; line-height: 1.35; color: var(--ink-soft);
    background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
    padding: 6px 11px; max-width: 200px; text-align: right;
  }
  @media (max-width: 640px) { .attribution { max-width: none; text-align: left; order: -1; width: 100%; } }

  .topnav { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0.95rem; color: var(--ink-soft); }
  .crumbs button { background: none; border: none; padding: 2px 4px; color: var(--focus); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .crumbs .sep { color: var(--rule); }
  .crumbs .here { color: var(--ink); font-weight: 700; padding: 2px 4px; }

  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; margin-bottom: 18px; }
  .muted { color: var(--ink-soft); }
  .small { font-size: 0.88rem; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .spacer { flex: 1; }
  .two { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; }
  @media (max-width: 820px) { .two { grid-template-columns: minmax(0, 1fr); } }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-weight: 700; font-size: 0.92rem; margin-bottom: 4px; }
  .field .hint { font-weight: 400; color: var(--ink-soft); }
  .field input[type=text], .field textarea {
    width: 100%; font-size: 1rem; color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 6px; padding: 9px 11px;
  }
  .field textarea { min-height: 110px; resize: vertical; line-height: 1.45; }
  .field input:focus, .field textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.95rem; margin-bottom: 8px; }
  .check input { margin-top: 5px; width: 17px; height: 17px; }

  .btn-quiet { background: var(--surface); border: 1px solid var(--rule); color: var(--ink); border-radius: 6px; padding: 7px 13px; cursor: pointer; font-size: 0.92rem; }
  .btn-quiet:hover:not(:disabled) { border-color: var(--ink-soft); }
  .btn-quiet:disabled, .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-main { background: var(--accent); color: var(--accent-ink); border: 2px solid var(--accent); border-radius: 8px; padding: 9px 18px; font-size: 0.98rem; font-weight: 700; cursor: pointer; }
  .btn-danger { background: var(--surface); color: var(--warn); border: 1px solid var(--warn); border-radius: 6px; padding: 7px 13px; cursor: pointer; font-size: 0.92rem; }
  .btn-danger.armed { background: var(--warn); color: var(--surface); }

  .chip { display: inline-block; font-size: 0.78rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; background: var(--paper); color: var(--ink-soft); border: 1px solid var(--rule); }
  .chip.writing { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .chip.away { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .chip.idle { background: var(--idle-bg); color: var(--idle); border-color: transparent; }
  .chip.sub, .chip.open { background: var(--sub-bg); color: var(--sub); border-color: transparent; }
  .chip.frz { background: var(--frz-bg); color: var(--frz); border-color: transparent; }
  .chip.lock { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .chip.held { background: var(--warn); color: var(--surface); border-color: transparent; }
  .tile.is-held { border: 2px solid var(--warn); padding: 9px 9px 7px; }

  .msg { margin: 0 0 16px; padding: 12px 14px; border-radius: 8px; font-weight: 700; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.err { background: var(--warn-bg); color: var(--warn); }
  .msg.info { background: var(--sub-bg); color: var(--sub); }
  .msg .sub { display: block; font-weight: 400; color: var(--ink); margin-top: 3px; }

  /* lists */
  .list { list-style: none; margin: 0; padding: 0; }
  .list > li { border-top: 1px solid var(--rule); }
  .list > li:first-child { border-top: none; }
  .rowbtn { display: flex; width: 100%; align-items: center; gap: 10px 14px; flex-wrap: wrap; background: none; border: none; text-align: left; padding: 12px 4px; cursor: pointer; }
  .rowbtn:hover .rb-title { text-decoration: underline; text-underline-offset: 3px; }
  .rb-title { font-weight: 700; font-size: 1.05rem; }
  .rb-meta { color: var(--ink-soft); font-size: 0.88rem; }
  .roster li { display: flex; align-items: center; gap: 10px; padding: 7px 2px; }
  .roster img { width: 26px; height: 26px; border-radius: 50%; }
  .linkbtn { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 0.85rem; text-decoration: underline; text-underline-offset: 3px; padding: 2px; }
  .linkbtn.danger { color: var(--warn); }

  /* join code, written large like on the board */
  .codebox { background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--nb-margin); border-radius: 8px; padding: 10px 18px; text-align: center; }
  .codebox .code { font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 700; letter-spacing: 0.14em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .codebox .k { font-size: 0.82rem; color: var(--ink-soft); }
  .classhead { display: flex; justify-content: space-between; gap: 14px 20px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 18px; }

  .lockband { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  .lockband strong { font-size: 1.02rem; }
  .lockband .btn-quiet { margin-left: auto; }
  .lockband svg { flex: none; }

  /* teacher live view */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .announce-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .announce-row input { flex: 1 1 260px; min-width: 0; font-size: 1rem; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 11px; }
  .counts { display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 14px 0 12px; font-size: 0.9rem; align-items: center; }
  .live { display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 18px; align-items: start; }
  .live.nodetail { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 980px) { .live, .live.nodetail { grid-template-columns: minmax(0, 1fr); } }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 12px; }
  .tile { display: flex; flex-direction: column; gap: 6px; text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 10px 8px; cursor: pointer; min-width: 0; }
  .tile:hover { border-color: var(--ink-soft); }
  .tile[aria-pressed="true"] { border: 2px solid var(--focus); padding: 9px 9px 7px; }
  .tile-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .tile-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini {
    --mlh: 1.3rem;
    height: calc(var(--mlh) * 5 + 8px); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    font-size: 0.8rem; line-height: var(--mlh); padding: 4px 6px 4px 22px; border-radius: 4px; border: 1px solid var(--rule);
    background-color: var(--paper);
    background-image:
      linear-gradient(to right, transparent 15px, var(--nb-margin) 15px, var(--nb-margin) 16px, transparent 16px),
      repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--mlh) - 1px), var(--nb-line) calc(var(--mlh) - 1px), var(--nb-line) var(--mlh));
    background-position: 0 0, 0 4px;
  }
  .mini span { white-space: pre-wrap; overflow-wrap: anywhere; }
  .mini.empty { color: var(--ink-soft); font-style: italic; justify-content: center; }
  .tile-foot { font-size: 0.78rem; color: var(--ink-soft); display: flex; gap: 4px 10px; flex-wrap: wrap; }
  .tile-foot .flag { color: var(--warn); font-weight: 700; }

  .detail { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto; }
  @media (max-width: 980px) { .detail { position: static; max-height: none; } }
  .detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .detail-head img { width: 32px; height: 32px; border-radius: 50%; }
  .detail-head h2 { margin: 0; font-size: 1.2rem; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; }
  .stat .v { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 0.78rem; color: var(--ink-soft); }
  .stat.flag .v { color: var(--warn); }
  .notes { list-style: none; margin: 0 0 8px; padding: 0; }
  .notes li { background: var(--paper); border: 1px solid var(--rule); border-left: 4px solid var(--focus); border-radius: 6px; padding: 7px 10px; margin-bottom: 6px; font-size: 0.95rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .notes li .t { display: block; font-size: 0.75rem; color: var(--ink-soft); }
  .notes li.fresh { background: var(--new); }
  .note-input { width: 100%; min-height: 64px; resize: vertical; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; font-size: 0.98rem; }
  .ruled-view {
    font-size: 1.02rem; line-height: var(--lh); padding: var(--lh) 14px var(--lh) 56px; min-height: calc(var(--lh) * 6);
    white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--rule); border-radius: 6px;
    background-color: var(--surface);
    background-image:
      linear-gradient(to right, transparent 40px, var(--nb-margin) 40px, var(--nb-margin) 42px, transparent 42px),
      repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), var(--nb-line) calc(var(--lh) - 1px), var(--nb-line) var(--lh));
    background-position: 0 0, 0 -9px;
  }
  .ruled-view.empty { color: var(--ink-soft); font-style: italic; }
  .events { margin: 6px 0 0; padding-left: 22px; max-height: 240px; overflow-y: auto; font-size: 0.88rem; }
  .events li { margin-bottom: 3px; }
  details summary { cursor: pointer; color: var(--ink-soft); font-size: 0.9rem; }
  .instr { white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0 0; }

  /* student writing page (matches the Typing Workspace) */
  .announce { background: var(--idle-bg); color: var(--ink); border-left: 4px solid var(--idle); border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; }
  .announce .k { font-weight: 700; color: var(--idle); display: block; font-size: 0.85rem; }
  .write-label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .write-label label { font-weight: 700; font-size: 0.92rem; }
  .write-label .hint { color: var(--ink-soft); font-size: 0.85rem; }
  textarea.editor {
    display: block; width: 100%; min-height: calc(var(--lh) * 14); resize: none; overflow: hidden;
    font-size: 1.12rem; line-height: var(--lh); padding: var(--lh) 22px var(--lh) 64px;
    border: 1px solid var(--rule); border-radius: 6px; color: var(--ink);
    white-space: pre-wrap; overflow-wrap: break-word;
    background-color: var(--surface);
    background-image:
      linear-gradient(to right, transparent 46px, var(--nb-margin) 46px, var(--nb-margin) 48px, transparent 48px),
      repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), var(--nb-line) calc(var(--lh) - 1px), var(--nb-line) var(--lh));
    background-position: 0 0, 0 -9px;
    background-attachment: local;
  }
  textarea.editor:focus { outline: none; border-color: var(--focus); }
  textarea.editor[readonly] { cursor: default; color: var(--ink-soft); }
  .statusbar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; font-size: 0.88rem; color: var(--ink-soft); margin-top: 8px; }
  .teacher-notes { background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--focus); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
  .focus-report { margin-top: 22px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
  .fr-note { font-size: 0.85rem; color: var(--ink-soft); margin: 4px 0 10px; max-width: 70ch; }
  .send-box { border-top: 1px solid var(--rule); margin-top: 22px; padding-top: 18px; }
  .confirm { margin-top: 14px; padding: 14px 16px; border: 2px solid var(--accent); border-radius: 8px; background: var(--surface); }
  .confirm p { margin: 0 0 10px; }
  .studentcard { max-width: 520px; }
  .joinrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .joinrow input { flex: 1 1 180px; min-width: 0; font-size: 1.4rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px; }
  .loading { padding: 40px 0; text-align: center; color: var(--ink-soft); }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <h1>Live Classroom</h1>
      <p class="lede" id="lede">Loading…</p>
    </div>
    <div class="attribution">Prepared with AI support, reviewed by Mr. Johnson</div>
  </header>
  <div id="banner"></div>
  <main id="app"><p class="loading">Connecting to your classes…</p></main>
</div>

<script>
'use strict';
/* ---------- helpers ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'value') el.value = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
function put(el, ...k) { el.replaceChildren(...k.flat(Infinity).filter(x => x != null && x !== false)); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function merge(a, b) {
  const out = Object.assign({}, a);
  for (const [k, v] of Object.entries(b)) out[k] = (isObj(v) && isObj(out[k])) ? merge(out[k], v) : v;
  return out;
}
const fmtTime = ms => ms ? new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
const fmtDay = ms => ms ? new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';
function fmtDur(ms) {
  const s = Math.max(0, Math.round((ms || 0) / 1000));
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60), r = s % 60;
  return m < 60 ? m + 'm ' + r + 's' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
}
const words = t => (t || '').trim() ? t.trim().split(/\s+/).length : 0;
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
function newCode() {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let s = ''; const r = crypto.getRandomValues(new Uint32Array(6));
  for (const x of r) s += A[x % A.length];
  return s;
}
const lockIcon = () => {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', '20'); svg.setAttribute('height', '20'); svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('aria-hidden', 'true');
  svg.innerHTML = '<rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/>';
  return svg;
};

/* ---------- state ---------- */
const S = {
  db: null, user: null, room: null, dl: null, uid: null, me: null,
  isTeacher: false, mode: 'loading', preview: false,
  classes: new Map(), assignments: new Map(), work: new Map(), feedback: new Map(),
  myWork: null, myFeedback: null, myWorkLoaded: false,
  peers: [], names: {}, avatars: {},
  view: { page: 'home', classId: null, asgId: null, studentId: null, sAsg: null },
  loaded: {}, slow: false, noWrite: false, error: '', notice: '',
  armed: null, freshNotes: new Set(),
};

/* ---------- writes: one at a time per document, bursts coalesced ---------- */
const writers = new Map();
function write(path, patch) {
  let w = writers.get(path);
  if (!w) { w = { pending: null, busy: false, waiters: [] }; writers.set(path, w); }
  w.pending = merge(w.pending || {}, patch);
  const p = new Promise((res, rej) => w.waiters.push({ res, rej }));
  p.catch(() => {});
  flush(path, w);
  return p;
}
async function flush(path, w) {
  if (w.busy || !w.pending) return;
  w.busy = true;
  const patch = w.pending, waiters = w.waiters;
  w.pending = null; w.waiters = [];
  const ref = S.db.doc(path);
  try {
    try { await ref.update(patch); }
    catch (e) {
      if (e && e.code === 'invalid_argument') {

let studentKey = '';

function renderStudent() {
  const app = document.getElementById('app');

  if (studentKey.startsWith('asg:') && key !== studentKey) leaveAsg();
  studentKey = key;
  const kept = keepInputs();
  const previewBar = S.mode === 'teacher' ? h('div', { class: 'msg info' }, 'You’re previewing the student view. Your test writing appears in your classes like a student’s. ',
    h('button', { class: 'btn-quiet', onclick: () => { leaveAsg(); S.preview = false; studentKey = ''; render(); } }, 'Back to teacher view')) : null;
  const noWrite = S.noWrite ? h('div', { class: 'msg err' }, 'This page is view-only for you, so your work can’t be saved.',

function joinCard(first) {

    err.hidden = true;

const asgNow = () => L.asg ? S.assignments.get(L.asg) : null;

  const e = (S.myWork && S.myWork.a && S.myWork.a[L.asg]) || {};

function refreshStudentAsg() {

  const a = asgNow(); if (!a) return;
  const lk = lockedFor();

    ed.announce.hidden = false;
  } else ed.announce.hidden = true;

  const ls = lockState();
  const msgs = {
    submitted: ['ok', 'Submitted' + (ls.at ? ' at ' + fmtTime(ls.at) : '') + '.', 'Your teacher can return it if you need to make changes.'],
    closed: ['err', 'This assignment is closed.', 'You can read your answers but not change them.'],

    frozen: ['info', 'Your teacher paused your typing.', 'Your work is saved. Check the notes from your teacher.'],

}

function updateWords() {
  if (!ed) return;

}

function trackingOn() { return studentKey.startsWith('asg:') && L.asg && !(lockState().why === 'submitted') && !S.noWrite; }
function goneAway() {

window.addEventListener('focus', cameBack);

/* ---------- startup ---------- */
function sub(key, q, onData) {

  q.onSnapshot(snap => { onData(snap); if (!snap.metadata.fromCache) S.loaded[key] = true; render(); },
    err => { S.loaded[key] = true; if (err && err.code !== 'invalid_argument') S.error = 'Live updates stopped. Reload the page to reconnect.'; render(); });
}
const toMap = snap => new Map(snap.docs.map(d => [d.id, d.data()]));

  if (!db) { S.mode = 'nodb'; render(); return; }
  S.uid = user ? await user.id() : null;
  if (!S.uid) { S.mode = 'signedout'; render(); return; }
  S.isTeacher = user ? await user.canEdit() : false;
  S.mode = S.isTeacher ? 'teacher' : 'student';

  sub('classes', db.collection('classes'), s => { S.classes = toMap(s); });

  if (S.isTeacher) {
    sub('work', db.collection('work'), s => { S.work = toMap(s); });
    sub('feedback', db.collection('feedback'), s => { S.feedback = toMap(s); });
    setInterval(() => { if (S.view.page === 'asg' && !S.preview) render(); }, 10000);
  }
  if (room) room.onPeers(ch => { S.peers = ch.peers; if (S.isTeacher && !S.preview && S.view.page === 'asg') render(); });
  setTimeout(() => { if (Object.values(S.loaded).some(v => !v)) { S.slow = true; render(); } }, 10000);
  render();
})();
</script>
</body>
</html>
