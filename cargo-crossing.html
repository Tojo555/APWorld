<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cargo Crossing: The Columbian Exchange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --surface-2:#E2EBED; --text:#14262E; --muted:#4D626B;
  --line:#C3D1D5; --ocean:#1D5566; --land:#E6D7B3; --land-edge:#9C8A60;
  --land-text:#4F3F22; --crimson:#A61E36; --crimson-soft:#F7E1E5; --gold:#B8862A;
  --good:#1E7A46; --good-soft:#DDF1E4; --bad:#A61E36; --bad-soft:#F7E1E5;
  --disease:#7B3FA0; --animal:#8A5A1C; --plant:#2E7D32; --people:#1F5F8B;
  --newworld:#FFC94D; --oldworld:#FF8A70;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1B21; --surface:#152730; --surface-2:#1C333D; --text:#E8EFF1; --muted:#9FB3BA;
    --line:#2D4651; --ocean:#16485A; --land:#D6C79F; --land-edge:#8C7A50;
    --land-text:#43341A; --crimson:#E2566D; --crimson-soft:#3A1C24; --gold:#E0B254;
    --good:#4CC27E; --good-soft:#163526; --bad:#F07A8C; --bad-soft:#3A1C24;
    --disease:#C59BE0; --animal:#E0AE6A; --plant:#7CCB80; --people:#7DB7E0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1B21; --surface:#152730; --surface-2:#1C333D; --text:#E8EFF1; --muted:#9FB3BA;
  --line:#2D4651; --ocean:#16485A; --land:#D6C79F; --land-edge:#8C7A50;
  --land-text:#43341A; --crimson:#E2566D; --crimson-soft:#3A1C24; --gold:#E0B254;
  --good:#4CC27E; --good-soft:#163526; --bad:#F07A8C; --bad-soft:#3A1C24;
  --disease:#C59BE0; --animal:#E0AE6A; --plant:#7CCB80; --people:#7DB7E0;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Alegreya Sans","Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.4}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%;max-width:1600px;margin:0 auto;padding:12px 20px 14px;gap:12px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:clamp(28px,3.2vw,44px);margin:0;line-height:1;color:var(--text)}
h1 small{display:block;font-family:"Alegreya Sans",Arial,sans-serif;font-weight:500;font-size:16px;color:var(--muted);margin-top:6px}
.ai-label{font-style:italic;font-size:14px;color:var(--muted);text-align:right;white-space:nowrap;padding-top:4px}
.main{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:16px;min-height:0}
.mapwrap{position:relative;width:100%;aspect-ratio:1000/600;align-self:start;border-radius:14px;overflow:hidden;background:var(--ocean)}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.land{fill:var(--land);stroke:var(--land-edge);stroke-width:1.2;stroke-linejoin:round}
.water{fill:var(--ocean);stroke:var(--land-edge);stroke-width:1}
.grat{fill:none;stroke:#FFFFFF;stroke-opacity:.10;stroke-width:1}
.region-label{font-family:"Alegreya",Georgia,serif;font-style:italic;font-weight:700;fill:var(--land-text);font-size:24px}
.world-label{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:46px;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:4px}
.world-label.nw{fill:var(--newworld)} .world-label.ow{fill:var(--oldworld)}
.ocean-label{font-family:"Alegreya",Georgia,serif;font-style:italic;fill:#FFFFFF;opacity:.6;font-size:20px;letter-spacing:4px}
.dock{position:absolute;transform:translate(-50%,-26px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2}
.dock button{background:var(--crimson);color:#fff;border:3px solid #fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:clamp(14px,1.4vw,19px);box-shadow:0 3px 8px rgba(0,0,0,.35);transition:transform .12s}
.dock button:hover:not(:disabled){transform:scale(1.08)}
.dock button:disabled{background:#5d6f75;cursor:default;opacity:.9}
.dock.correct button{background:var(--good)!important;opacity:1}
.dock.wrong button{background:#3a3a3a!important;text-decoration:line-through}
.stack{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 4px;max-width:clamp(150px,19vw,250px);font-size:clamp(26px,3vw,44px);line-height:1.05}
.dock-americas .stack{max-width:clamp(190px,24vw,320px)}
.stack:not(:empty){background:rgba(8,28,36,.55);border-radius:12px;padding:4px 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.turn{font-size:17px;color:var(--muted)}
.turn b{color:var(--crimson);font-size:21px}
.crate{display:flex;align-items:center;gap:16px;background:var(--surface-2);border-radius:12px;padding:14px 16px}
.crate .emoji{font-size:64px;line-height:1}
.crate.compact{padding:8px 14px}.crate.compact .emoji{font-size:40px}.crate.compact .name{font-size:26px}
.crate .name{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:clamp(26px,2.4vw,36px);line-height:1.05}
.tag{display:inline-block;margin-top:6px;font-weight:700;font-size:14px;padding:2px 10px;border-radius:999px;border:2px solid currentColor}
.tag.Disease{color:var(--disease)} .tag.Animal{color:var(--animal)} .tag.Plant{color:var(--plant)} .tag.People{color:var(--people)}
.prompt{font-size:21px;font-weight:700;margin:0}
.note{font-size:16px;margin:0;padding:8px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.result{border-radius:10px;padding:10px 14px;font-size:18px}
.result.good{background:var(--good-soft);color:var(--text);border:2px solid var(--good)}
.result.bad{background:var(--bad-soft);color:var(--text);border:2px solid var(--bad)}
.result strong{display:block;font-size:20px}
.bonus h3{margin:0 0 6px;font-family:"Alegreya",Georgia,serif;font-size:20px;color:var(--gold)}
.bonus .q{font-size:21px;font-weight:700;margin:0}
.answer{margin-top:10px;background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:19px}
.btn{border:2px solid var(--text);background:transparent;color:var(--text);border-radius:10px;padding:8px 14px;font-weight:700}
.btn.primary{background:var(--crimson);border-color:var(--crimson);color:#fff}
.btn:hover{filter:brightness(1.08)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.small{font-size:15px;color:var(--muted)}
footer{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.team{flex:1 1 150px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.team.active{border-color:var(--crimson);background:var(--crimson-soft)}
.team .tn{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .ts{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:32px;color:var(--gold);line-height:1}
.adj{display:flex;flex-direction:column;gap:2px}
.adj button{width:26px;height:22px;padding:0;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:14px;line-height:1}
.meta{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:6px;padding:0 4px}
.meta .left{font-weight:700;font-size:16px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(8,20,26,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay[hidden]{display:none}
.modal{background:var(--surface);color:var(--text);border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:24px 28px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-family:"Alegreya",Georgia,serif;font-size:34px;margin:0;line-height:1.05}
.modal ul{margin:0;padding-left:22px}
.modal li{margin:4px 0}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.names input,.wager{font:inherit;padding:8px 10px;border-radius:8px;border:2px solid var(--line);background:var(--surface-2);color:var(--text);width:100%}
.count button{min-width:44px}
.count button[aria-pressed="true"]{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.wrow{display:grid;grid-template-columns:1fr 100px 160px;gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.wrow.two{grid-template-columns:1fr 160px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
.bcell{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:10px;padding:6px 8px 6px 12px}
.bcell .tn{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcell .mark{flex:0 0 78px}
.bcell .mark button{padding:4px 0;background:var(--surface)}
.wrow .tn{font-weight:800}
.mark{display:flex;gap:6px}
.mark button{flex:1;padding:6px 0;border-radius:8px;border:2px solid var(--line);background:var(--surface-2);color:var(--text);font-weight:800}
.mark button[aria-pressed="true"].y{background:var(--good);border-color:var(--good);color:#fff}
.mark button[aria-pressed="true"].n{background:var(--bad);border-color:var(--bad);color:#fff}
.podium{font-family:"Alegreya",Georgia,serif;font-size:26px}
.podium li:first-child{font-size:34px;font-weight:800;color:var(--gold)}
#ship{pointer-events:none}
@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .app{height:auto}
  .ai-label{white-space:normal;max-width:180px}
}
@media (prefers-reduced-motion: reduce){ .dock button{transition:none} }
</style>
</head>

<script>
const DOCKS = {
  americas:{label:"Americas", x:339.3, y:180.7},
  europe:{label:"Europe", x:541.9, y:137.9},
  africa:{label:"Africa", x:495.4, y:385},
  asia:{label:"Asia", x:909.4, y:309.9}
};
const OLD = ["europe","africa","asia"];
const PTS = {dock:1, bonus:1};

/* Crates play in this fixed order. */
const CARDS = [
  {id:"smallpox", name:"Smallpox", emoji:"🦠", cat:"Disease", origin:"europe", accept:["americas"],
   why:"Smallpox crossed from the Old World and devastated the Americas, where people had no immunity.",
   q:"Scholars estimate what percentage of indigenous Americans died from disease?", a:"50–90%"},
  {id:"syphilis", name:"Syphilis", emoji:"🦠", cat:"Disease", origin:"americas", accept:["europe"],
   why:"Syphilis went from the Americas to Europe. Green calls it the New World’s one “gift” to the Old World.",
   q:"Green calls syphilis a “gift” from the Americas. What was another gift that was even more destructive?", a:"Tobacco"},
  {id:"pigs", name:"Pigs", emoji:"🐖", cat:"Animal", origin:"europe", accept:["americas"],
   why:"Pigs were brought from the Old World to the Americas.",
   q:"What’s great about pigs?", a:"They breed easily and eat anything, so they were great for the food supply. They helped reduce famine in the Americas."},
  {id:"oxen", name:"Oxen", emoji:"🐂", cat:"Animal", origin:"europe", accept:["americas"],
   why:"Oxen were brought from the Old World to the Americas.",
   q:"What’s great about oxen?", a:"Pulling plows, they let more land be cultivated. They also made transportation easier and more efficient."},
  {id:"horses", name:"Horses", emoji:"🐎", cat:"Animal", origin:"europe", accept:["americas"],
   why:"Horses were brought from the Old World to the Americas.",
   q:"What effect does the video highlight that horses had on the Americas?", a:"They allowed many Native Americans to abandon agriculture for hunting."},
  {id:"potatoes", name:"Potatoes", emoji:"🥔", cat:"Plant", origin:"americas", accept:["europe"],
   why:"Potatoes went from the Americas to the Old World and transformed Europe in particular.",
   q:"Where did potatoes cause a population explosion that set up a terrible famine in the mid-1800s?", a:"Ireland"},
  {id:"corn", name:"Corn", emoji:"🌽", cat:"Plant", origin:"americas", accept:OLD,
   why:"Corn went from the Americas to the whole Old World.",
   q:"Corn is crucial to whose diet?", a:"Animals, as animal feed, especially in the Old World"},
  {id:"tomatoes", name:"Tomatoes", emoji:"🍅", cat:"Plant", origin:"americas", accept:OLD,
   why:"Tomatoes went from the Americas to the Old World.",
   q:"New World foods increased what intake, and what major effect did that have?", a:"Calories, which led to the greatest population increase in history"},
];
const FINAL = [
  {q:"What effect has the Columbian Exchange had on plant and animal species worldwide?", a:"Their populations and variation have diminished. Species around the world became more alike."}
];
const byId = Object.fromEntries(CARDS.map(c=>[c.id,c]));

let S = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SAVE_KEY = "cargoCrossing2";
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function loadSaved(){ try{ const v = localStorage.getItem(SAVE_KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function clearSaved(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

function newGame(names){
  S = { teams:names.map(n=>({name:n, score:0})), deck:CARDS.map(c=>c.id), idx:0, turn:0,
        phase:"choose", picked:null, bmarks:[], docked:{americas:[],europe:[],africa:[],asia:[]},
        finalIdx:0, finalStep:"wager", wagers:[], marks:[] };
  save(); closeModal(); renderAll();
}
const card = () => byId[S.deck[S.idx]];
const team = () => S.teams[S.turn];
const cargoWord = c => c.quoteCargo ? "“cargo”" : "cargo";

/* ---------- Rendering ---------- */
function renderAll(){ renderDocks(); renderPanel(); renderScores(); }

function renderDocks(){
  const c = S && S.phase!=="choose" && S.phase!=="final" && S.idx < S.deck.length ? card() : null;
  $("docks").innerHTML = Object.entries(DOCKS).map(([k,d])=>{
    let cls = "dock";
    if(c && S.picked){ if(c.accept.includes(k)) cls+=" correct"; else if(S.picked===k) cls+=" wrong"; }
    const stack = (S ? S.docked[k] : []).map(id=>`<span title="${esc(byId[id].name)}">${byId[id].emoji}</span>`).join("");
    return `<div class="${cls} dock-${k}" style="left:${d.x/10}%;top:${d.y/6}%">
      <button data-dock="${k}" ${S && S.phase==="choose" ? "" : "disabled"} aria-label="Unload at ${d.label}">${d.label}</button>
      <div class="stack">${stack}</div></div>`;
  }).join("");
  document.querySelectorAll("[data-dock]").forEach(b=>b.addEventListener("click",()=>chooseDock(b.dataset.dock)));
}

function renderScores(){
  if(!S){ $("scores").innerHTML=""; return; }
  const left = Math.max(0, S.deck.length - S.idx - (S.phase==="choose"?0:1));
  $("scores").innerHTML = S.teams.map((t,i)=>`
    <div class="team ${i===S.turn && S.phase!=="final" ? "active":""}">
      <span class="tn" title="${esc(t.name)}">${esc(t.name)}</span>
      <span class="row" style="gap:8px;flex-wrap:nowrap">
        <span class="ts">${t.score}</span>
        <span class="adj"><button data-adj="${i}" data-d="1" aria-label="Add a point to ${esc(t.name)}">+</button><button data-adj="${i}" data-d="-1" aria-label="Take a point from ${esc(t.name)}">−</button></span>
      </span>
    </div>`).join("") + `
    <div class="meta"><span class="left">${S.phase==="final" ? "Final voyage" : left + " crates left"}</span>
      <span class="row"><button class="btn" id="howBtn">How to play</button><button class="btn" id="resetBtn">New game</button></span></div>`;
  document.querySelectorAll("[data-adj]").forEach(b=>b.addEventListener("click",()=>{
    S.teams[+b.dataset.adj].score += +b.dataset.d; save(); renderScores();
  }));
  $("howBtn").onclick = showHow;
  $("resetBtn").onclick = ()=>{ if(confirm("Start a new game? Current scores will be cleared.")){ clearSaved(); showSetup(); } };
}

function crateHTML(c, compact){
  return `<div class="crate${compact?" compact":""}"><span class="emoji" aria-hidden="true">${c.emoji}</span>
    <div><div class="name">${esc(c.name)}</div><span class="tag ${c.cat}">${c.cat}</span></div></div>`;
}

function renderPanel(){
  const P = $("panel");
  if(!S){ P.innerHTML=""; return; }
  if(S.phase==="final"){ renderFinal(); return; }
  const c = card(), t = team();
  let h = `<div class="turn">Crate ${S.idx+1} of ${S.deck.length} · <b>${esc(t.name)}</b> picks the dock</div>` + crateHTML(c, S.phase!=="choose");
  if(c.note && S.phase==="choose") h += `<p class="note">${esc(c.note)}</p>`;
  if(S.phase==="choose"){
    h += `<p class="prompt">Where does this ${cargoWord(c)} unload? Click a dock on the map.</p>
          <p class="small" style="margin:0">Correct dock: +${PTS.dock} for ${esc(t.name)}. Then every team answers a bonus question for +${PTS.bonus}.</p>`;
  } else {
    const ok = c.accept.includes(S.picked);
    const where = c.accept.length===3 ? "any Old World dock" : DOCKS[c.accept[0]].label;
    h += `<div class="result ${ok?"good":"bad"}"><strong>${ok ? "✓ Correct dock! +"+PTS.dock : "✗ Not quite. Its main landing place is "+where+"."}</strong>${S.phase==="bonus" ? esc(c.why) : ""}</div>`;
    h += `<div class="bonus"><h3>Bonus question for every team (+${PTS.bonus})</h3><p class="q">${esc(c.q)}</p>`;
    if(S.phase==="bonus"){
      h += `<p class="small" style="margin:8px 0 0">All teams write an answer, then reveal.</p>
            <div class="row" style="margin-top:10px"><button class="btn primary" id="revealBtn">Reveal answer</button></div>`;
    } else {
      h += `<div class="answer"><b>Answer:</b> ${esc(c.a)}</div>
        <div class="bgrid">${S.teams.map((tt,i)=>`<div class="bcell"><span class="tn">${esc(tt.name)}</span>
          <span class="mark"><button class="y" data-bm="${i}" data-v="1" aria-pressed="${S.bmarks[i]===1}" aria-label="${esc(tt.name)} correct">✓</button><button class="n" data-bm="${i}" data-v="0" aria-pressed="${S.bmarks[i]===0}" aria-label="${esc(tt.name)} incorrect">✗</button></span></div>`).join("")}</div>
        <div class="row" style="margin-top:12px"><button class="btn primary" id="awardBtn">Award points and next crate</button></div>`;
    }
    h += `</div>`;
  }
  P.innerHTML = h;
  if($("revealBtn")) $("revealBtn").onclick = ()=>{ S.phase="revealed"; S.bmarks=S.teams.map(()=>null); save(); renderPanel(); };
  P.querySelectorAll("[data-bm]").forEach(b=>b.addEventListener("click",()=>{ S.bmarks[+b.dataset.bm]=+b.dataset.v; save(); renderPanel(); }));
  if($("awardBtn")) $("awardBtn").onclick = ()=>{
    S.teams.forEach((tt,i)=>{ if(S.bmarks[i]===1) tt.score += PTS.bonus; });
    nextTurn();
  };
}

/* ---------- Game flow ---------- */
function chooseDock(k){
  if(S.phase!=="choose") return;
  const c = card(); S.picked = k;
  const ok = c.accept.includes(k);
  if(ok) team().score += PTS.dock;
  const dest = ok ? k : c.accept[0];
  S.phase = "bonus"; S.docked[dest].push(c.id); save();
  const full = S.docked[dest]; S.docked[dest] = full.slice(0,-1);
  renderPanel(); renderScores(); renderDocks();
  S.docked[dest] = full;
  sail(c.origin, dest, c.emoji, ()=>{ renderDocks(); });
}
function nextTurn(){
  S.idx++; S.picked=null; S.bmarks=[];
  if(S.idx >= S.deck.length){
    S.phase="final"; S.finalIdx=0; S.finalStep="wager"; S.wagers=S.teams.map(()=>0); S.marks=S.teams.map(()=>null);
  } else { S.turn=(S.turn+1)%S.teams.length; S.phase="choose"; }
  save(); renderAll();
}

/* ---------- Final voyage ---------- */
function renderFinal(){
  const P = $("panel"), f = FINAL[S.finalIdx];
  if(!f){ showWinner(); P.innerHTML = `<p class="prompt">The voyage is over. See the final standings.</p><div class="row"><button class="btn primary" id="standBtn">Show standings</button></div>`; $("standBtn").onclick=showWinner; return; }
  let h = `<div class="turn"><b>Final voyage</b> · Question ${S.finalIdx+1} of ${FINAL.length}</div>`;
  if(S.finalStep==="wager"){
    h += `<p class="small" style="margin:0">Each team secretly writes a wager (0 up to its current score). Enter the wagers, then show the question.</p>`;
    h += S.teams.map((t,i)=>`<div class="wrow two" style="grid-template-columns:1fr 110px"><span class="tn">${esc(t.name)} <span class="small">(${t.score})</span></span>
      <input class="wager" type="number" min="0" max="${Math.max(0,t.score)}" value="${S.wagers[i]}" data-w="${i}" aria-label="Wager for ${esc(t.name)}"></div>`).join("");
    h += `<div class="row"><button class="btn primary" id="showQ">Show the question</button></div>`;
  } else {
    h += `<p class="q" style="font-size:22px;font-weight:700;margin:0">${esc(f.q)}</p>`;
    if(S.finalStep==="question"){
      h += `<p class="small" style="margin:0">Teams write their answers. Reveal when everyone is ready.</p><div class="row"><button class="btn primary" id="revealF">Reveal answer</button></div>`;
    } else {
      h += `<div class="answer"><b>Answer:</b> ${esc(f.a)}</div>`;
      h += S.teams.map((t,i)=>`<div class="wrow"><span class="tn">${esc(t.name)}</span><span class="small">wager ${S.wagers[i]}</span>
        <span class="mark"><button class="y" data-m="${i}" data-v="1" aria-pressed="${S.marks[i]===1}">✓</button><button class="n" data-m="${i}" data-v="0" aria-pressed="${S.marks[i]===0}">✗</button></span></div>`).join("");
      h += `<div class="row"><button class="btn primary" id="applyF">Apply scores and continue</button></div>`;
    }
  }
  P.innerHTML = h;
  P.querySelectorAll("[data-w]").forEach(inp=>{
    inp.addEventListener("input",()=>{ const i=+inp.dataset.w; let v=Math.floor(+inp.value||0); v=Math.max(0,Math.min(v,Math.max(0,S.teams[i].score))); S.wagers[i]=v; save(); });
    inp.addEventListener("change",()=>{ inp.value=S.wagers[+inp.dataset.w]; });
  });
  if($("showQ")) $("showQ").onclick=()=>{ S.finalStep="question"; save(); renderFinal(); };
  if($("revealF")) $("revealF").onclick=()=>{ S.finalStep="answer"; save(); renderFinal(); };
  P.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>{ S.marks[+b.dataset.m]=+b.dataset.v; save(); renderFinal(); }));
  if($("applyF")) $("applyF").onclick=()=>{
    S.teams.forEach((t,i)=>{ if(S.marks[i]===1) t.score+=S.wagers[i]; else if(S.marks[i]===0) t.score-=S.wagers[i]; });
    S.finalIdx++; S.finalStep="wager"; S.wagers=S.teams.map(()=>0); S.marks=S.teams.map(()=>null);
    save(); renderScores(); renderFinal();
  };
}
function showWinner(){
  const ranked = S.teams.slice().sort((a,b)=>b.score-a.score);
  openModal(`<h2>Land ho! Final standings</h2>
    <ol class="podium">${ranked.map(t=>`<li>${esc(t.name)} · ${t.score}</li>`).join("")}</ol>
    <div class="row"><button class="btn" id="closeW">Back to the map</button><button class="btn primary" id="againW">New game</button></div>`);
  $("closeW").onclick=closeModal; $("againW").onclick=()=>{ clearSaved(); showSetup(); };
}

/* ---------- Ship animation ---------- */
function sail(from, to, emoji, done){
  const A = DOCKS[from], B = DOCKS[to], ship = $("ship");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(from===to || reduce){ done(); return; }
  let c1, c2;
  if(to==="asia"){ c1={x:420,y:700}; c2={x:860,y:700}; }
  else { const off=-40; c1={x:A.x+(B.x-A.x)/3, y:A.y+(B.y-A.y)/3+off}; c2={x:A.x+2*(B.x-A.x)/3, y:A.y+2*(B.y-A.y)/3+off}; }
  $("shipCargo").textContent = emoji;
  $("hull").setAttribute("transform", B.x < A.x ? "scale(-1,1)" : "");
  ship.setAttribute("opacity","1");
  const dur = to==="asia" ? 2800 : 1800, t0 = performance.now();
  function step(now){
    const t = Math.min(1,(now-t0)/dur); const e = t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; const u=1-e;
    const x = u*u*u*A.x + 3*u*u*e*c1.x + 3*u*e*e*c2.x + e*e*e*B.x;
    const y = u*u*u*A.y + 3*u*u*e*c1.y + 3*u*e*e*c2.y + e*e*e*B.y;
    ship.setAttribute("transform",`translate(${x},${y})`);
    if(t<1) requestAnimationFrame(step); else { ship.setAttribute("opacity","0"); done(); }
  }
  requestAnimationFrame(step);
}

/* ---------- Modals ---------- */
function openModal(html){ $("modal").innerHTML=html; $("overlay").hidden=false; const f=$("modal").querySelector("button,input"); if(f) f.focus(); }
function closeModal(){ $("overlay").hidden=true; }
function howHTML(){
  return `<ul>
    <li>Each turn, one team gets a crate: a disease, animal, or plant from the Columbian Exchange.</li>
    <li>That team decides which dock it unloads at. Old World cargo goes to the Americas. New World cargo goes to Europe, Africa, or Asia. Some crops count at any Old World dock, but potatoes and syphilis go to their main landing place. <b>+${PTS.dock}</b></li>
    <li>Then <b>every team</b> writes an answer to a bonus question about that crate. Each team that gets it right earns <b>+${PTS.bonus}</b>.</li>
    <li>After all ${CARDS.length} crates, the Final voyage: one wager question for every team.</li>
    <li>The + and − buttons next to each score fix any mistakes.</li></ul>`;
}
function showHow(){ openModal(`<h2>How to play</h2>${howHTML()}<div class="row"><button class="btn primary" id="closeH">Back to the game</button></div>`); $("closeH").onclick=closeModal; }

function showSetup(){
  const saved = loadSaved();
  let n = 4; const defaults=["Santa María","Pinta","Niña","Golden Hind","Mayflower","Victoria"];
  function draw(){
    openModal(`<h2>Cargo Crossing</h2>
      <p style="margin:0">Teams sail the crops, germs, and animals of the Columbian Exchange to the right side of the Atlantic.</p>
      ${howHTML()}
      <div><b>Number of teams</b><div class="row count" style="margin-top:6px">${[2,3,4,5,6].map(k=>`<button class="btn" data-n="${k}" aria-pressed="${k===n}">${k}</button>`).join("")}</div></div>
      <div><b>Team names</b><div class="names" style="margin-top:6px">${Array.from({length:n},(_,i)=>`<input id="tn${i}" value="${esc(defaults[i])}" aria-label="Team ${i+1} name">`).join("")}</div></div>
      <div class="row">${saved && saved.teams ? `<button class="btn" id="resumeBtn">Resume saved game</button>` : ""}<button class="btn primary" id="startBtn">Set sail</button></div>`);
    document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ n=+b.dataset.n; draw(); });
    $("startBtn").onclick=()=>newGame(Array.from({length:n},(_,i)=>($("tn"+i).value.trim()||("Team "+(i+1)))));
    if($("resumeBtn")) $("resumeBtn").onclick=()=>{ S=saved; if(!S.bmarks) S.bmarks=S.teams.map(()=>null); closeModal(); renderAll(); };
  }
  draw();
}

renderDocks(); showSetup();
</script>
