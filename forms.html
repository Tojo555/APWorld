<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Form definition</title>
</head>
<body>
<!-- This page only tells Netlify which form fields to expect.
     The real page is encrypted, so Netlify can't see its form. Contains no student work. -->
<form name="team-paragraph" method="POST" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="team-paragraph">
  <input type="text" name="student-name">
  <input type="text" name="title">
  <textarea name="paragraph"></textarea>
  <input type="text" name="word-count">
  <textarea name="sources"></textarea>
  <input type="text" name="plan-question">
  <textarea name="plan-thesis"></textarea>
  <textarea name="plan-evidence"></textarea>
  <textarea name="plan-analysis"></textarea>
  <textarea name="focus-report"></textarea>
  <input type="text" name="copied-for">
  <input type="text" name="assignment">
</form>
</body>
</html>
