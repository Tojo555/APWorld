<title>Building Colonial Societies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEC; --surface:#FFFFFF; --surface-2:#E3E7E5; --text:#1C2321; --muted:#56605C; --line:#C5CCC8;
  --accent:#2F4A6B; --accent-soft:#E1E8F1; --gold:#8C6A2A;
  --good:#2F6B45; --good-soft:#E0EEE4; --bad:#8A2F2F; --bad-soft:#F3E3E1;
  --sky:#D9E1E4; --ground:#B9B391; --ground-2:#A39C78; --sea:#7E98A6; --ink:#2B2A26; --wall:#F2EEE4; --roof:#8E5A43;
  --society:#2F4A6B; --labor:#7A5321; --economy:#3F6B3A; --religion:#5E3F78;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151A19; --surface:#1E2523; --surface-2:#27302D; --text:#E7EBE9; --muted:#A3ADA9; --line:#36413D;
    --accent:#9DB7D8; --accent-soft:#24303D; --gold:#D6B572;
    --good:#7CC496; --good-soft:#1D3326; --bad:#E39A93; --bad-soft:#3A2321;
    --sky:#2A3438; --ground:#5B5740; --ground-2:#4C4834; --sea:#3E5663; --ink:#E7E2D4; --wall:#3B3A34; --roof:#8A5C47;
    --society:#9DB7D8; --labor:#D9A86A; --economy:#94C48C; --religion:#C2A2E0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151A19; --surface:#1E2523; --surface-2:#27302D; --text:#E7EBE9; --muted:#A3ADA9; --line:#36413D;
  --accent:#9DB7D8; --accent-soft:#24303D; --gold:#D6B572;
  --good:#7CC496; --good-soft:#1D3326; --bad:#E39A93; --bad-soft:#3A2321;
  --sky:#2A3438; --ground:#5B5740; --ground-2:#4C4834; --sea:#3E5663; --ink:#E7E2D4; --wall:#3B3A34; --roof:#8A5C47;
  --society:#9DB7D8; --labor:#D9A86A; --economy:#94C48C; --religion:#C2A2E0;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Alegreya Sans","Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.4}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%;max-width:1680px;margin:0 auto;padding:12px 20px 14px;gap:12px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:clamp(28px,3vw,42px);margin:0;line-height:1}
h1 small{display:block;font-family:"Alegreya Sans",Arial,sans-serif;font-weight:500;font-size:16px;color:var(--muted);margin-top:6px}
.ai-label{font-style:italic;font-size:14px;color:var(--muted);text-align:right;white-space:nowrap;padding-top:4px}
.main{display:grid;grid-template-columns:minmax(0,2fr) minmax(320px,1fr);gap:16px;min-height:0}
.plots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:start;min-height:0;overflow:auto}
.plot{background:var(--surface);border:2px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.plot.correct{border-color:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.plot.wrong{border-color:var(--bad)}
.plot-head{display:flex;flex-direction:column;gap:6px;padding:10px 12px 8px}
.plot-head h2{margin:0;font-family:"Alegreya",Georgia,serif;font-size:clamp(20px,1.7vw,26px);line-height:1.05}
.plot-head .mc{font-size:14px;color:var(--muted)}
.place{border:2px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:6px 10px;font-weight:800;font-size:16px}
:root .place{color:var(--surface)}
.place:disabled{background:transparent;color:var(--muted);border-color:var(--line);cursor:default}
.scene{display:block;width:100%;height:auto;background:var(--sky)}
.scene .gr{fill:var(--ground)} .scene .gr2{fill:var(--ground-2)} .scene .sea{fill:var(--sea)}
.scene .wall{fill:var(--wall);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.scene .roof{fill:var(--roof);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.scene .ln{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round}
.scene .dk{fill:var(--ink)}
.scene .cap{font-family:"Alegreya Sans",Arial,sans-serif;font-size:14px;font-weight:700;fill:var(--ink)}
.scene .empty{font-family:"Alegreya",Georgia,serif;font-style:italic;font-size:13px;fill:var(--ink);opacity:.55}
.scene .new{animation:rise .6s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.scene .new{animation:none}}
.ledger{padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.ledger h3{margin:0;font-size:14px;font-weight:700;color:var(--muted)}
.ledger ul{margin:0;padding-left:18px;font-size:16px}
.ledger li{margin:2px 0}
.ledger .none{font-size:15px;color:var(--muted);font-style:italic;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.turn{font-size:17px;color:var(--muted)}
.turn b{color:var(--accent);font-size:21px}
.card{background:var(--surface-2);border-radius:10px;padding:14px 16px;border-left:6px solid var(--accent)}
.card .name{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:clamp(26px,2.3vw,34px);line-height:1.05}
.card.Society{border-left-color:var(--society)} .card.Labor{border-left-color:var(--labor)} .card.Economy{border-left-color:var(--economy)} .card.Religion{border-left-color:var(--religion)}
.tag{display:inline-block;margin-top:6px;font-weight:700;font-size:14px;padding:1px 10px;border-radius:999px;border:2px solid currentColor}
.tag.Society{color:var(--society)} .tag.Labor{color:var(--labor)} .tag.Economy{color:var(--economy)} .tag.Religion{color:var(--religion)}
.profile{font-family:"Alegreya",Georgia,serif;font-size:clamp(21px,1.8vw,26px);line-height:1.35;margin:0;background:var(--surface-2);border-radius:10px;padding:14px 16px;border-left:6px solid var(--gold)}
.prompt{font-size:21px;font-weight:700;margin:0}
.note{font-size:16px;margin:0;padding:8px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.result{border-radius:10px;padding:10px 14px;font-size:18px}
.result.good{background:var(--good-soft);border:2px solid var(--good)}
.result.bad{background:var(--bad-soft);border:2px solid var(--bad)}
.result strong{display:block;font-size:20px}
.bonus h3{margin:0 0 6px;font-family:"Alegreya",Georgia,serif;font-size:20px;color:var(--gold)}
.bonus .q{font-size:21px;font-weight:700;margin:0}
.answer{margin-top:10px;background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:19px}
.btn{border:2px solid var(--text);background:transparent;color:var(--text);border-radius:10px;padding:8px 14px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:hover{filter:brightness(1.08)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.small{font-size:15px;color:var(--muted)}
footer{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.team{flex:1 1 150px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.team.active{border-color:var(--accent);background:var(--accent-soft)}
.team .tn{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .ts{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:32px;color:var(--gold);line-height:1}
.adj{display:flex;flex-direction:column;gap:2px}
.adj button{width:26px;height:22px;padding:0;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:14px;line-height:1}
.meta{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:6px;padding:0 4px}
.meta .left{font-weight:700;font-size:16px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,14,13,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{background:var(--surface);color:var(--text);border-radius:14px;max-width:780px;width:100%;max-height:92vh;overflow:auto;padding:24px 28px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-family:"Alegreya",Georgia,serif;font-size:34px;margin:0;line-height:1.05}
.modal ul{margin:0;padding-left:22px}
.modal li{margin:4px 0}
.framing{margin:0;padding:10px 14px;border-left:4px solid var(--gold);background:var(--surface-2);border-radius:6px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.names input,.wager{font:inherit;padding:8px 10px;border-radius:8px;border:2px solid var(--line);background:var(--surface-2);color:var(--text);width:100%}
.count button{min-width:44px}
.count button[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.wrow{display:grid;grid-template-columns:1fr 100px 160px;gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.wrow .tn{font-weight:800}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
.bcell{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:10px;padding:6px 8px 6px 12px}
.bcell .tn{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcell .mark{flex:0 0 78px}
.wgrid{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;align-items:center;margin-top:10px}
.wgrid .hd{font-size:14px;color:var(--muted);font-weight:700;text-align:center}
.wgrid .tn{font-weight:800}
.wgrid .mark{width:86px}
.mark{display:flex;gap:6px}
.mark button{flex:1;padding:5px 0;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--text);font-weight:800}
.mark button[aria-pressed="true"].y{background:var(--good);border-color:var(--good);color:var(--surface)}
.mark button[aria-pressed="true"].n{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.rosters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.roster{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.roster input{font:inherit;font-weight:800;width:100%;padding:4px 8px;border-radius:6px;border:2px solid var(--line);background:var(--surface);color:var(--text)}
.roster ul{margin:6px 0 0;padding-left:20px;font-size:16px}
.cd{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 0;gap:4px}
.cd-start{font-size:24px;padding:14px 28px}
.cd-label{font-size:20px;font-weight:700;color:var(--muted)}
.cd-n{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:150px;line-height:1;color:var(--accent)}
.cd-n.pop{animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(1.35);opacity:.3}to{transform:none;opacity:1}}
.timer{display:flex;align-items:center;gap:12px}
.track{flex:1;height:16px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar{height:100%;width:100%;background:var(--accent);transition:width .2s linear}
.tnum{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:34px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent)}
.timer.low .bar{background:var(--bad)} .timer.low .tnum{color:var(--bad)}
@media (prefers-reduced-motion: reduce){.cd-n.pop{animation:none}.bar{transition:none}}
.podium{font-family:"Alegreya",Georgia,serif;font-size:26px}
.podium li:first-child{font-size:32px;font-weight:800;color:var(--gold)}
.round{display:inline-block;font-weight:800;font-size:14px;color:var(--gold);border:2px solid var(--gold);border-radius:999px;padding:1px 10px;margin-right:6px}
@media (max-width:1100px){
  .main{grid-template-columns:1fr}
  .app{height:auto}
}
@media (max-width:760px){
  .plots{grid-template-columns:1fr}
  .ai-label{white-space:normal;max-width:170px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Building Colonial Societies<small>Comparing Colonial Societies in the Americas, Strayer pp. 209–219</small></h1>
    <div class="ai-label">Prepared with AI support, reviewed by Mr. Johnson</div>
  </header>
  <div class="main">
    <div class="plots" id="plots"></div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
  <footer id="scores"></footer>
</div>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
const PLOTS = {
  spanish:{label:"Spanish America", mc:"Colonized by Spain: Mexico and Peru", sea:"none"},
  brazil:{label:"Brazil & Caribbean", mc:"Plantation colonies: Portugal and others", sea:"right"},
  northam:{label:"British North America", mc:"Colonized mainly by England", sea:"right"}
};
const ORDER = ["spanish","brazil","northam"];
const PTS = {place:1, bonus:1};

/* What each card adds to the scene: buildings (by plot) and lines in the Society record. */
const CARDS = [
  {id:"sugar", name:"Sugar plantations", cat:"Economy", accept:["brazil"],
   builds:{brazil:["mill"]}, ledger:{brazil:"Sugar produced on an industrial scale for a global market"},
   why:"Brazil and the Caribbean were organized around sugar: huge, factory-like plantations producing for a global market.",
   q:"Sugar was very labor intensive. Why did planters force enslaved Africans to do this work instead of Native Americans?",
   a:"Few Native peoples were left after the Great Dying from Old World diseases, so planters imported enslaved Africans through the Atlantic slave trade."},
  {id:"mestizo", name:"Mestizo population", cat:"Society", accept:["spanish"],
   ledger:{spanish:"Large mestizo (mixed Spanish and Native) population"},
   why:"A large mestizo population was the most distinctive feature of colonial Mexico and Peru.",
   q:"Why did such a large mestizo population develop in Spanish America?",
   a:"Very few Spanish women came to the colonies, so Spanish men formed unions with Native American women."},
  {id:"protestant", name:"Protestant churches", cat:"Religion", accept:["northam"],
   builds:{northam:["meeting"]}, ledger:{northam:"Mostly Protestant; less missionary work, higher literacy"},
   why:"Most British North American colonists were Protestant, not Catholic.",
   q:"Protestant colonies did less missionary work but ended up with higher literacy. Why higher literacy?",
   a:"Protestants stressed reading the Bible for yourself, so ordinary people learned to read."},
  {id:"encomienda", name:"Encomienda", cat:"Labor", accept:["spanish"],
   builds:{spanish:["village"]},
   why:"The encomienda was a Spanish labor system that forced Native communities to provide tribute and labor.",
   q:"Under the encomienda, what did the Spanish crown grant a conquistador, and what did it turn into in practice?",
   a:"The labor and tribute of a set number of Native Americans in an area. In practice it became a form of enslavement."},
  {id:"enslaved", name:"The Atlantic slave trade", cat:"Labor", accept:["brazil"],
   ledger:{brazil:"Most enslaved Africans forced here; far larger African population"},
   why:"Brazil and the Caribbean received the vast majority of enslaved Africans, giving them far larger African populations than Spanish or North America.",
   q:"About what percent of enslaved Africans brought to the Americas were forced to Brazil or the Caribbean?",
   a:"About 80%"},
  {id:"settlers", name:"Settler families", cat:"Society", accept:["northam"],
   builds:{northam:["farm"]}, ledger:{northam:"Many European women and families; “almost pure” settler colonies"},
   why:"Far more British settlers came, including many women and whole families.",
   q:"Why was there much less racial mixing in British North America than in Spanish America?",
   a:"Many more European women came, so European settlers mostly married each other."},
  {id:"castas", name:"Casta system", cat:"Society", accept:["spanish"],
   ledger:{spanish:"Castas: people ranked by ancestry and skin color"},
   why:"Spanish colonists tried to rank everyone in a sociedad de castas, a hierarchy of socio-racial classes.",
   q:"What decided a person’s place in the castas? Could people move up or down?",
   a:"Their precise racial ancestry and skin color. Yes, some movement up and down was possible.",
   q2:{pts:2, title:"Special bonus: the racial hierarchy",
       split:true,
       q:"For each description below, write the specific term used for that group, then rank the groups from the top (1) to the bottom (5) of Spanish America’s social hierarchy.",
       items:["Children of Spanish men and Native women","People brought by force from Africa, and their descendants","People of Spanish ancestry born in the Americas","The Native peoples of the Americas","Spanish people born in Spain"],
       order:["Peninsulares: born in Spain","Creoles: American-born Spanish","Mestizos: children of Spanish men and Native (Indian) women","Indians: Indigenous peoples","Enslaved Africans: brought by force from Africa, and their descendants"],
       rule:"1 point for the correct order. 1 point for all the correct terms."}},
  {id:"mercantilism", name:"Mercantilism", cat:"Economy", accept:ORDER,
   note:"Careful: this card might fit more than one society.",
   builds:{spanish:["port"],brazil:["port"],northam:["port"]},
   ledger:{spanish:"Raw materials shipped to the mother country",brazil:"Raw materials shipped to the mother country",northam:"Raw materials shipped to the mother country"},
   why:"Every colonial power ran its colonies on mercantilist ideas, so this card counts anywhere. A port for shipping raw materials appears in all three.",
   q:"Under mercantilism, what did colonies supply, and what did the mother country want to pile up?",
   a:"Colonies supplied raw materials. The mother country exported more than it imported in order to pile up bullion (gold and silver)."},
  {id:"divide", name:"Sharp racial divide", cat:"Society", accept:["northam"],
   ledger:{northam:"Sharply defined racial system; little acceptance of mixed-race people"},
   why:"British North America accepted mixed-race people far less, creating a sharply defined racial system."},
  {id:"hacienda", name:"Hacienda", cat:"Labor", accept:["spanish"],
   builds:{spanish:["hacienda"]},
   why:"Haciendas were large landed estates in Spanish America. Workers were supposedly free wage earners, but landowners bound them to the land through debt."},
  {id:"catholic", name:"Catholic missions", cat:"Religion", accept:["spanish","brazil"],
   builds:{spanish:["church"],brazil:["church"]}, ledger:{spanish:"Catholic; church and state closely linked"},
   why:"Catholic Spain and Portugal tied church and state closely together and sent many missionaries. This card counts in both.",
   q:"Many Native Americans blended Catholic and traditional beliefs. What is that blending called?",
   a:"Syncretism (for example, the Virgin of Guadalupe)."},
];

/* Round 2: composite profiles based on patterns in the reading, not real individuals. */
const WHO = [
  {text:"Born in Mexico City to a Spanish father and a Native mother, she belongs to a fast-growing group in the middle of the colonial hierarchy.",
   colony:"spanish", group:"Mestizo", why:"Few Spanish women came, so mixed Spanish-Native families became common."},
  {text:"He arrived in Massachusetts with his wife and four children. The family reads the Bible together at home.",
   colony:"northam", group:"Protestant settler family", why:"English colonists often came as families, and Protestants stressed reading the Bible."},
  {text:"Captured in West Africa and carried across the Atlantic, he is forced to work on a sugar plantation. The work is so deadly that planters keep buying new captives instead of relying on births.",
   colony:"brazil", group:"Enslaved African on a sugar plantation", why:"About 80% of enslaved Africans were forced to Brazil and the Caribbean."},
  {text:"Born in Seville, he was sent to Lima as a royal official. He holds one of the highest positions in colonial society.",
   colony:"spanish", group:"Peninsular", why:"Spanish-born whites held the top of the colonial hierarchy."},
  {text:"Born in Virginia to an English father and an enslaved African mother, he is classified as Black and enslaved under colonial law. There is no in-between category for him.",
   colony:"northam", group:"Enslaved person under a sharp racial divide", why:"North America drew a hard racial line instead of in-between categories."},
  {text:"She lives in a Native village in central Mexico. A Spanish grantee demands tribute and labor from her community. She attends Mass but keeps some traditional practices.",
   colony:"spanish", group:"Native American under the encomienda (practicing syncretism)", why:"The encomienda forced tribute and labor; blending beliefs is syncretism."},
  {text:"Born in Bahia to an African mother and a Portuguese father, he was later freed and now works as a skilled craftsman.",
   colony:"brazil", group:"Free person of mixed African and European descent", why:"In Brazil some enslaved people were freed and had economic opportunities."},
  {text:"Born in Mexico City to parents of Spanish descent, he is wealthy, but the top government posts go to men born in Spain.",
   colony:"spanish", group:"Creole", why:"Creoles had Spanish ancestry but ranked below Spain-born peninsulares."},
];
const FINAL = [
  {q:"Choose two of the three colonial societies. Give one similarity and one difference between them, with evidence.",
   a:"Many answers work. Similarities: all ran on mercantilism; all relied on forced or enslaved labor; all ranked people by race. Differences: mestizos and castas in Spanish America; sugar and most enslaved Africans in Brazil and the Caribbean; settler families, a sharp racial divide, and Protestant literacy in North America."}
];
const byId = Object.fromEntries(CARDS.map(c=>[c.id,c]));

/* ---------- Scene drawing ---------- */
const SLOTS = {
  spanish:{church:44, hacienda:134, village:228, port:318},
  brazil:{mill:80, church:190, port:300},
  northam:{meeting:70, farm:180, port:300}
};
const CAPS = {church:"Church", hacienda:"Hacienda", village:"Encomienda", port:"Port",
  mill:"Sugar mill", meeting:"Meetinghouse", farm:"Family farm"};
function bld(kind, x){
  const g = (inner)=>`<g transform="translate(${x},0)">${inner}<text class="cap" x="0" y="166" text-anchor="middle">${CAPS[kind]}</text></g>`;
  switch(kind){
    case "church": return g(`<rect class="wall" x="-20" y="100" width="40" height="42"/><path class="roof" d="M-24,100 L0,84 L24,100 Z"/>
      <rect class="wall" x="12" y="66" width="16" height="76"/><path class="roof" d="M10,66 L20,54 L30,66 Z"/><path class="ln" d="M20,54 V42 M15,47 H25"/>

function sceneSVG(k){
  const built = S ? S.built[k] : [], fresh = S ? S.fresh : [];
  const sea = PLOTS[k].sea==="right" ? `<path class="sea" d="M270,142 C290,140 320,138 360,136 V180 H270 Z"/>` : "";
  const items = built.map(b=>`<g class="${fresh.includes(k+":"+b)?"new":""}">${bld(b, SLOTS[k][b])}</g>`).join("");
  const empty = built.length ? "" : `<text class="empty" x="180" y="80" text-anchor="middle">Nothing placed yet</text>`;
  return `<svg class="scene" viewBox="0 0 360 172" role="img" aria-label="${PLOTS[k].label}: ${built.map(b=>CAPS[b]).join(", ")||"empty"}">
    <path class="gr" d="M0,140 C80,132 200,140 360,134 V172 H0 Z"/><path class="gr2" d="M0,150 C120,146 240,154 360,148 V172 H0 Z"/>${sea}${empty}${items}</svg>`;
}

/* ---------- State ---------- */
let S = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SAVE_KEY = "buildingColonies1";
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function loadSaved(){ try{ const v = localStorage.getItem(SAVE_KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function clearSaved(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

function newGame(names, groups){
  S = { teams:names.map((n,i)=>({name:n, score:0, members:groups ? groups[i] : []})), idx:0, turn:0, phase:"choose", picked:null, bmarks:[],
        built:{spanish:[],brazil:[],northam:[]}, led:{spanish:[],brazil:[],northam:[]}, fresh:[],
        whoIdx:0, whoStep:"question", cm:[], gm:[],
        finalIdx:0, finalStep:"wager", wagers:[], marks:[] };
  stopTimers(); revealedKey=null; guessEnd=0;
  save(); closeModal(); renderAll();
}
const card = () => CARDS[S.idx];
const team = () => S.teams[S.turn];

function applyCard(c){
  S.fresh = [];
  for(const [k,list] of Object.entries(c.builds||{})) for(const b of list){ if(!S.built[k].includes(b)){ S.built[k].push(b); S.fresh.push(k+":"+b); } }
  for(const [k,line] of Object.entries(c.ledger||{})) if(!S.led[k].includes(c.id)) S.led[k].push(c.id);
}

/* ---------- Rendering ---------- */
function renderAll(){ renderPlots(); renderPanel(); renderScores(); }
function renderPlots(){
  let mark = {};
  if(S && (S.phase==="bonus"||S.phase==="revealed")){ const c=card(); ORDER.forEach(k=>{ if(c.accept.includes(k)) mark[k]="correct"; else if(S.picked===k) mark[k]="wrong"; }); }
  if(S && S.phase==="who" && S.whoStep==="answer"){ mark[WHO[S.whoIdx].colony]="correct"; }
  $("plots").innerHTML = ORDER.map(k=>{
    const p = PLOTS[k], led = S ? S.led[k] : [];
    return `<div class="plot ${mark[k]||""}">
      <div class="plot-head"><h2>${p.label}</h2><span class="mc">${p.mc}</span>
        ${!S || ["choose","bonus","revealed"].includes(S.phase) ? `<button class="place" data-plot="${k}" ${S && S.phase==="choose" && revealedKey==="c"+S.idx ? "" : "disabled"}>Place it here</button>` : ""}</div>
      ${sceneSVG(k)}
      <div class="ledger"><h3>Society record</h3>${led.length ? `<ul>${led.map(id=>`<li>${esc(byId[id].ledger[k])}</li>`).join("")}</ul>` : `<p class="none">No entries yet</p>`}</div>
    </div>`;
  }).join("");
  document.querySelectorAll("[data-plot]").forEach(b=>b.addEventListener("click",()=>choosePlot(b.dataset.plot)));
}
function renderScores(){
  if(!S){ $("scores").innerHTML=""; return; }
  let left;
  if(S.phase==="who") left = `Round 2 · profile ${S.whoIdx+1} of ${WHO.length}`;
  else if(S.phase==="final") left = "Final question";
  else { const n=CARDS.length - S.idx; left = `${n} card${n===1?"":"s"} left`; }
  $("scores").innerHTML = S.teams.map((t,i)=>`
    <div class="team ${i===S.turn && (S.phase==="choose"||S.phase==="bonus"||S.phase==="revealed") ? "active":""}">
      <span class="tn" title="${esc(t.name)}">${esc(t.name)}</span>
      <span class="row" style="gap:8px;flex-wrap:nowrap"><span class="ts">${t.score}</span>
        <span class="adj"><button data-adj="${i}" data-d="1" aria-label="Add a point to ${esc(t.name)}">+</button><button data-adj="${i}" data-d="-1" aria-label="Take a point from ${esc(t.name)}">−</button></span></span>
    </div>`).join("") + `
    <div class="meta"><span class="left">${left}</span>
      <span class="row"><button class="btn" id="rosterBtn">Teams</button><button class="btn" id="howBtn">How to play</button><button class="btn" id="resetBtn">New game</button></span></div>`;
  document.querySelectorAll("[data-adj]").forEach(b=>b.addEventListener("click",()=>{ S.teams[+b.dataset.adj].score += +b.dataset.d; save(); renderScores(); }));
  $("howBtn").onclick = showHow;
  $("rosterBtn").onclick = showRosters;
  $("resetBtn").onclick = ()=>{ if(confirm("Start a new game? Current scores will be cleared.")){ clearSaved(); showSetup(); } };
}
function cardHTML(c){
  return `<div class="card ${c.cat}"><div class="name">${esc(c.name)}</div><span class="tag ${c.cat}">${c.cat}</span></div>`;
}
function marksGrid(attr, arr){
  return `<div class="bgrid">${S.teams.map((tt,i)=>`<div class="bcell"><span class="tn">${esc(tt.name)}</span>
    <span class="mark"><button class="y" data-${attr}="${i}" data-v="1" aria-pressed="${arr[i]===1}" aria-label="${esc(tt.name)} correct">✓</button><button class="n" data-${attr}="${i}" data-v="0" aria-pressed="${arr[i]===0}" aria-label="${esc(tt.name)} incorrect">✗</button></span></div>`).join("")}</div>`;
}
function bonusesOf(c){
  const B = [];
  if(c.q) B.push({pts:PTS.bonus, title:`Bonus question for every team (+${PTS.bonus})`, q:c.q, a:c.a});
  if(c.q2) B.push({...c.q2, title:`${c.q2.title} (+${c.q2.pts})`});
  return B;
}
const GUESS_SECS = 20, CD_SECS = 5;
let cdN = CD_SECS;
let revealedKey=null, cdKey=null, cdTimer=null, guessTimer=null, guessEnd=0;
function stopTimers(){ clearInterval(cdTimer); clearInterval(guessTimer); cdTimer=null; guessTimer=null; cdKey=null; }
function countdownHTML(label, key){
  if(cdKey===key) return `<div class="cd" aria-live="assertive"><span class="cd-label">${label}</span><span class="cd-n pop" id="cdN">${cdN}</span></div>`;
  return `<div class="cd"><button class="btn primary cd-start" id="cdGo">Start countdown</button><span class="small">${label} after a ${CD_SECS}-second countdown</span></div>`;
}
function gate(P, prefix, label, key, onDone, suffix=""){
  P.innerHTML = prefix + countdownHTML(label, key) + suffix;
  const go = $("cdGo");
  if(go){ go.focus(); go.onclick = ()=>{ startCountdown(key, onDone); gate(P, prefix, label, key, onDone, suffix); }; }
}
function startCountdown(key, onDone){
  if(cdKey===key) return;
  stopTimers(); cdKey=key; cdN=CD_SECS;
  cdTimer=setInterval(()=>{
    const n = --cdN;
    if(n<=0){ clearInterval(cdTimer); cdTimer=null; cdKey=null; revealedKey=key; onDone(); return; }
    const e=$("cdN"); if(e){ e.textContent=n; e.classList.remove("pop"); void e.offsetWidth; e.classList.add("pop"); }
  },1000);
}
function tick(){
  const left = Math.max(0, guessEnd - Date.now()), secs = Math.ceil(left/1000);
  const bar=$("tBar"), num=$("tNum"), box=$("tBox");
  if(bar) bar.style.width = (left/(GUESS_SECS*1000)*100)+"%";
  if(num) num.textContent = secs;
  if(box) box.classList.toggle("low", secs<=5);
  if(left<=0){ stopTimers(); timeUp(); }
}
function timeUp(){
  if(!S || S.phase!=="choose") return;
  guessEnd=0; S.picked=null; S.timedOut=true;
  applyCard(card()); S.phase="bonus"; save(); renderAll();
}
function renderPanel(){
  const P = $("panel");
  if(!S){ P.innerHTML=""; return; }
  if(S.phase==="who"){ renderWho(); return; }
  if(S.phase==="final"){ renderFinal(); return; }
  const c = card(), t = team(), B = bonusesOf(c), bi = S.bi||0;
  const turnLine = `<div class="turn">Card ${S.idx+1} of ${CARDS.length} · <b>${esc(t.name)}</b> places it</div>`;
  const ckey = "c"+S.idx;
  if(S.phase==="choose" && revealedKey!==ckey){
    gate(P, turnLine, "Card appears", ckey, ()=>{ guessEnd = Date.now()+GUESS_SECS*1000; renderAll(); });
    return;
  }
  let h = turnLine + cardHTML(c);
  if(S.phase==="choose"){
    h += `<div class="timer" id="tBox"><div class="track"><div class="bar" id="tBar"></div></div><span class="tnum" id="tNum">${GUESS_SECS}</span></div>`;
    if(c.note) h += `<p class="note">${esc(c.note)}</p>`;
    h += `<p class="prompt">Which colonial society does this belong to? Click “Place it here” on that society. You have ${GUESS_SECS} seconds.</p>
          <p class="small" style="margin:0">Correct placement: +${PTS.place} for ${esc(t.name)}.${B.length ? ` Then every team answers ${B.length>1?"two bonus questions":"a bonus question"}.` : ""}</p>`;
  } else {
    const ok = S.picked && c.accept.includes(S.picked);
    const where = c.accept.length===3 ? "any of the three" : c.accept.map(k=>PLOTS[k].label).join(" and ");
    h += `<div class="result ${ok?"good":"bad"}"><strong>${ok ? "✓ Correct. +"+PTS.place : (S.picked ? "✗ Not quite." : "⏱ Time’s up.")+" It belongs in "+where+"."}</strong>${esc(c.why)}</div>`;
    if(!B.length){
      h += `<div class="row"><button class="btn primary" id="nextBtn">Next card</button></div>`;
    } else {
      const b = B[bi], bkey = "b"+S.idx+"-"+bi;
      h += `<div class="bonus"><h3>${esc(b.title)}</h3><p class="q">${esc(b.q)}</p>`;
      if(b.items) h += `<ul style="margin:8px 0 0;font-size:19px">${b.items.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`;
      if(S.phase==="bonus"){
        h += `<p class="small" style="margin:8px 0 0">All teams write an answer.${b.rule?" "+esc(b.rule):""} Then reveal.</p>
              <div class="row" style="margin-top:10px"><button class="btn primary" id="revealBtn">Reveal answer</button></div>`;
      } else {
        const ans = b.order ? `<b>Answer, top to bottom:</b><ol style="margin:6px 0 0">${b.order.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>` : `<b>Answer:</b> ${esc(b.a)}`;
        const more = bi+1 < B.length;
        const grid = b.split ? `<div class="wgrid"><span></span><span class="hd">Order (+1)</span><span class="hd">All terms (+1)</span>
          ${S.teams.map((tt,i)=>`<span class="tn">${esc(tt.name)}</span>
          <span class="mark"><button class="y" data-bm="${i}" data-v="1" aria-pressed="${S.bmarks[i]===1}" aria-label="${esc(tt.name)} order correct">✓</button><button class="n" data-bm="${i}" data-v="0" aria-pressed="${S.bmarks[i]===0}" aria-label="${esc(tt.name)} order incorrect">✗</button></span>
          <span class="mark"><button class="y" data-bn="${i}" data-v="1" aria-pressed="${(S.bmarks2||[])[i]===1}" aria-label="${esc(tt.name)} terms correct">✓</button><button class="n" data-bn="${i}" data-v="0" aria-pressed="${(S.bmarks2||[])[i]===0}" aria-label="${esc(tt.name)} terms incorrect">✗</button></span>`).join("")}</div>` : marksGrid("bm", S.bmarks);
        h += `<div class="answer">${ans}</div>${grid}
          <div class="row" style="margin-top:12px"><button class="btn primary" id="awardBtn">Award points and ${more?"next bonus question":"next card"}</button></div>`;
      }
      h += `</div>`;
    }
  }
  P.innerHTML = h;
  if(S.phase==="choose" && !guessTimer){ if(!guessEnd) guessEnd = Date.now()+GUESS_SECS*1000; guessTimer=setInterval(tick,200); }
  if(S.phase==="choose") tick();
  if($("nextBtn")) $("nextBtn").onclick = nextCard;
  if($("revealBtn")) $("revealBtn").onclick = ()=>{ S.phase="revealed"; S.bmarks=S.teams.map(()=>null); save(); renderPanel(); };
  P.querySelectorAll("[data-bm]").forEach(b=>b.addEventListener("click",()=>{ S.bmarks[+b.dataset.bm]=+b.dataset.v; save(); renderPanel(); }));
  P.querySelectorAll("[data-bn]").forEach(b=>b.addEventListener("click",()=>{ if(!S.bmarks2) S.bmarks2=[]; S.bmarks2[+b.dataset.bn]=+b.dataset.v; save(); renderPanel(); }));
  if($("awardBtn")) $("awardBtn").onclick = ()=>{
    const b = B[bi];
    if(b.split) S.teams.forEach((tt,i)=>{ if(S.bmarks[i]===1) tt.score += 1; if((S.bmarks2||[])[i]===1) tt.score += 1; });
    else S.teams.forEach((tt,i)=>{ if(S.bmarks[i]===1) tt.score += b.pts; });
    S.bmarks2=[];
    if(bi+1 < B.length){ S.bi = bi+1; S.phase="bonus"; S.bmarks=[]; save(); renderAll(); }
    else nextCard();
  };
}

/* ---------- Round 1 flow ---------- */
function choosePlot(k){
  if(S.phase!=="choose" || revealedKey!=="c"+S.idx) return;
  stopTimers(); guessEnd=0; S.timedOut=false;
  const c = card(); S.picked = k;
  if(c.accept.includes(k)) team().score += PTS.place;
  applyCard(c);
  S.phase = "bonus"; save(); renderAll();
}
function nextCard(){
  S.idx++; S.picked=null; S.bmarks=[]; S.fresh=[]; S.bi=0;
  if(S.idx >= CARDS.length){ S.phase="final"; S.finalIdx=0; S.finalStep="wager"; S.wagers=S.teams.map(()=>0); S.marks=S.teams.map(()=>null); }
  else { S.turn=(S.turn+1)%S.teams.length; S.phase="choose"; }
  save(); renderAll();
}

/* ---------- Round 2: Who Lived Here? ---------- */
function renderWho(){
  const P = $("panel");
  if(S.whoStep==="intro"){
    P.innerHTML = `<div class="turn"><span class="round">Round 2</span><b>Who Lived Here?</b></div>
      <p style="margin:0">The three societies are built. Now read short profiles of people who could have lived in them. These are composites based on patterns in the reading, not real individuals.</p>
      <p style="margin:0">For each profile, every team writes two things:</p>
      <ul style="margin:0"><li>Which colonial society? <b>+1</b></li><li>What group or category does this person belong to? <b>+1</b></li></ul>
      <div class="row"><button class="btn primary" id="startWho">Show the first profile</button></div>`;
    $("startWho").onclick = ()=>{ S.whoStep="question"; save(); renderAll(); };

  }
  const w = WHO[S.whoIdx];

    <p class="profile">${esc(w.text)}</p>`;

    h += `<p class="prompt" style="font-size:19px">Write: (1) which society, and (2) this person’s group or category.</p>
      <div class="row"><button class="btn primary" id="revealWho">Reveal answer</button></div>`;
  } else {
    h += `<div class="answer"><b>Society:</b> ${esc(PLOTS[w.colony].label)}<br><b>Group:</b> ${esc(w.group)}<br><span class="small">${esc(w.why)}</span></div>
      <div class="wgrid"><span></span><span class="hd">Society</span><span class="hd">Group</span>
      ${S.teams.map((t,i)=>`<span class="tn">${esc(t.name)}</span>
        <span class="mark"><button class="y" data-cm="${i}" data-v="1" aria-pressed="${S.cm[i]===1}" aria-label="${esc(t.name)} society correct">✓</button><button class="n" data-cm="${i}" data-v="0" aria-pressed="${S.cm[i]===0}" aria-label="${esc(t.name)} society incorrect">✗</button></span>
        <span class="mark"><button class="y" data-gm="${i}" data-v="1" aria-pressed="${S.gm[i]===1}" aria-label="${esc(t.name)} group correct">✓</button><button class="n" data-gm="${i}" data-v="0" aria-pressed="${S.gm[i]===0}" aria-label="${esc(t.name)} group incorrect">✗</button></span>`).join("")}</div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="awardWho">Award points and next profile</button></div>`;
  }
  P.innerHTML = h;
  if($("revealWho")) $("revealWho").onclick = ()=>{ S.whoStep="answer"; S.cm=S.teams.map(()=>null); S.gm=S.teams.map(()=>null); save(); renderAll(); };
  P.querySelectorAll("[data-cm]").forEach(b=>b.addEventListener("click",()=>{ S.cm[+b.dataset.cm]=+b.dataset.v; save(); renderWho(); }));
  P.querySelectorAll("[data-gm]").forEach(b=>b.addEventListener("click",()=>{ S.gm[+b.dataset.gm]=+b.dataset.v; save(); renderWho(); }));
  if($("awardWho")) $("awardWho").onclick = ()=>{
    S.teams.forEach((t,i)=>{ if(S.cm[i]===1) t.score++; if(S.gm[i]===1) t.score++; });
    S.whoIdx++; S.cm=[]; S.gm=[];
    if(S.whoIdx >= WHO.length){ S.phase="final"; S.finalIdx=0; S.finalStep="wager"; S.wagers=S.teams.map(()=>0); S.marks=S.teams.map(()=>null); }
    else S.whoStep="question";
    save(); renderAll();
  };
}

/* ---------- Final question ---------- */
function renderFinal(){
  const P = $("panel"), f = FINAL[S.finalIdx];
  if(!f){ P.innerHTML = `<p class="prompt">The game is over.</p><div class="row"><button class="btn primary" id="standBtn">Show final standings</button></div>`; $("standBtn").onclick=showWinner; return; }
  let h = `<div class="turn"><span class="round">Final</span><b>Comparison question</b></div>`;
  if(S.finalStep==="wager"){
    h += `<p class="small" style="margin:0">Each team secretly writes a wager (0 up to its current score). Enter the wagers, then show the question.</p>`;
    h += S.teams.map((t,i)=>`<div class="wrow" style="grid-template-columns:1fr 110px"><span class="tn">${esc(t.name)} <span class="small">(${t.score})</span></span>
      <input class="wager" type="number" min="0" max="${Math.max(0,t.score)}" value="${S.wagers[i]}" data-w="${i}" aria-label="Wager for ${esc(t.name)}"></div>`).join("");
    h += `<div class="row"><button class="btn primary" id="showQ">Show the question</button></div>`;
  } else {
    const fkey = "f"+S.finalIdx;
    if(S.finalStep==="question" && revealedKey!==fkey){
      gate(P, h, "Final question appears", fkey, renderFinal);
      return;
    }
    h += `<p style="font-size:22px;font-weight:700;margin:0">${esc(f.q)}</p>`;
    if(S.finalStep==="question"){
      h += `<p class="small" style="margin:0">Teams write their answers. Reveal when everyone is ready.</p><div class="row"><button class="btn primary" id="revealF">Reveal sample answers</button></div>`;
    } else {
      h += `<div class="answer"><b>Sample answers:</b> ${esc(f.a)}</div>`;
      h += S.teams.map((t,i)=>`<div class="wrow"><span class="tn">${esc(t.name)}</span><span class="small">wager ${S.wagers[i]}</span>
        <span class="mark"><button class="y" data-m="${i}" data-v="1" aria-pressed="${S.marks[i]===1}" aria-label="${esc(t.name)} correct">✓</button><button class="n" data-m="${i}" data-v="0" aria-pressed="${S.marks[i]===0}" aria-label="${esc(t.name)} incorrect">✗</button></span></div>`).join("");
      h += `<div class="row"><button class="btn primary" id="applyF">Apply scores</button></div>`;
    }
  }
  P.innerHTML = h;
  P.querySelectorAll("[data-w]").forEach(inp=>{
    inp.addEventListener("input",()=>{ const i=+inp.dataset.w; let v=Math.floor(+inp.value||0); v=Math.max(0,Math.min(v,Math.max(0,S.teams[i].score))); S.wagers[i]=v; save(); });
    inp.addEventListener("change",()=>{ inp.value=S.wagers[+inp.dataset.w]; });
  });
  if($("showQ")) $("showQ").onclick=()=>{ S.finalStep="question"; save(); renderFinal(); };
  if($("revealF")) $("revealF").onclick=()=>{ S.finalStep="answer"; save(); renderFinal(); };
  P.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>{ S.marks[+b.dataset.m]=+b.dataset.v; save(); renderFinal(); }));
  if($("applyF")) $("applyF").onclick=()=>{
    S.teams.forEach((t,i)=>{ if(S.marks[i]===1) t.score+=S.wagers[i]; else if(S.marks[i]===0) t.score-=S.wagers[i]; });
    S.finalIdx++; save(); renderScores(); renderFinal(); showWinner();
  };
}
function showWinner(){
  const ranked = S.teams.slice().sort((a,b)=>b.score-a.score);
  openModal(`<h2>Final standings</h2>
    <ol class="podium">${ranked.map(t=>`<li>${esc(t.name)}: ${t.score}</li>`).join("")}</ol>
    <p class="framing">Look back at the three societies on screen. What explains the biggest differences between them?</p>
    <div class="row"><button class="btn" id="closeW">Back to the board</button><button class="btn primary" id="againW">New game</button></div>`);
  $("closeW").onclick=closeModal; $("againW").onclick=()=>{ clearSaved(); showSetup(); };
}

/* ---------- Modals ---------- */
function openModal(html){ $("modal").innerHTML=html; $("overlay").hidden=false; const f=$("modal").querySelector("button,input"); if(f) f.focus(); }
function closeModal(){ $("overlay").hidden=true; }
function howHTML(){
  return `<ul>
    <li><b>Building the societies (${CARDS.length} cards):</b> After a ${CD_SECS}-second countdown, one team at a time gets a card: an institution, a labor system, a group of people, or a belief. That team has <b>${GUESS_SECS} seconds</b> to place it in Spanish America, Brazil &amp; the Caribbean, or British North America. Correct: <b>+${PTS.place}</b>. A few cards fit more than one.</li>
    <li>After most placements, <b>every team</b> writes an answer to a bonus question. Each correct team earns <b>+${PTS.bonus}</b>. The casta card also has a special bonus: <b>+1</b> for the correct order and <b>+1</b> for all the correct terms. The card’s buildings and record entries then appear in the right society.</li>
    <li><b>Final:</b> one comparison question, with wagers.</li>
    <li>The + and − buttons next to each score fix any mistakes.</li></ul>`;
}
function showHow(){ openModal(`<h2>How to play</h2>${howHTML()}<div class="row"><button class="btn primary" id="closeH">Back to the game</button></div>`); $("closeH").onclick=closeModal; }
const ROSTER_KEY = "buildingColoniesRoster";
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function parseNames(t){ return t.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean); }
function showSetup(){
  const saved = loadSaved();
  let n = 4, text = "", groups = null, tnames = [];
  try{ text = localStorage.getItem(ROSTER_KEY) || ""; }catch(e){}
  function randomize(){
    const names = shuffle(parseNames(text));
    groups = Array.from({length:n},()=>[]);
    names.forEach((s,i)=>groups[i%n].push(s));
    groups = shuffle(groups);
  }
  function readNames(){ tnames = Array.from({length:n},(_,i)=>{ const el=$("tn"+i); return el ? el.value : (tnames[i]||"Team "+(i+1)); }); }
  function draw(){
    const count = parseNames(text).length;
    openModal(`<h2>Building Colonial Societies</h2>
      <p class="framing">Spain, Portugal, and England built these societies through conquest, forced labor, and the enslavement of millions of Africans. Each piece you place stands for a real system that shaped people’s lives. The goal is to explain how and why the three societies differed.</p>
      <div><b>Student names</b> <span class="small">(one per line, or separated by commas)</span>
        <textarea id="roster" rows="5" style="display:block;width:100%;margin-top:6px;font:inherit;padding:8px 10px;border-radius:8px;border:2px solid var(--line);background:var(--surface-2);color:var(--text);resize:vertical">${esc(text)}</textarea>
        <span class="small">${count} name${count===1?"":"s"}</span></div>
      <div><b>Number of teams</b><div class="row count" style="margin-top:6px">${[2,3,4,5,6,7,8].map(k=>`<button class="btn" data-n="${k}" aria-pressed="${k===n}">${k}</button>`).join("")}
        <button class="btn primary" id="randBtn" style="margin-left:8px">${groups ? "Reshuffle teams" : "Randomize teams"}</button></div></div>
      <div class="rosters">${Array.from({length:n},(_,i)=>`<div class="roster">
          <input id="tn${i}" value="${esc(tnames[i]||"Team "+(i+1))}" aria-label="Team ${i+1} name">
          ${groups ? `<ul>${groups[i].map(s=>`<li>${esc(s)}</li>`).join("") || "<li class='small'>No students</li>"}</ul>` : ""}</div>`).join("")}</div>
      <div class="row">${saved && saved.teams ? `<button class="btn" id="resumeBtn">Resume saved game</button>` : ""}<button class="btn primary" id="startBtn">Begin</button>
        <button class="btn" id="rulesBtn">How to play</button></div>`);
    $("roster").addEventListener("input", e=>{ text = e.target.value; try{ localStorage.setItem(ROSTER_KEY, text); }catch(err){} });
    document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ readNames(); n=+b.dataset.n; if(groups) randomize(); draw(); });
    $("randBtn").onclick=()=>{ readNames(); randomize(); draw(); };
    $("rulesBtn").onclick=()=>{ readNames(); openModal(`<h2>How to play</h2>${howHTML()}<div class="row"><button class="btn primary" id="backS">Back</button></div>`); $("backS").onclick=draw; };
    $("startBtn").onclick=()=>{ readNames(); newGame(tnames.map((t,i)=>t.trim()||("Team "+(i+1))), groups); };
    if($("resumeBtn")) $("resumeBtn").onclick=()=>{ S=saved; S.fresh=[]; closeModal(); renderAll(); };
  }
  draw();
}
function showRosters(){
  openModal(`<h2>Teams</h2><div class="rosters">${S.teams.map(t=>`<div class="roster"><b style="font-size:20px">${esc(t.name)}</b>
    ${t.members && t.members.length ? `<ul>${t.members.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>` : `<p class="small" style="margin:4px 0 0">No names entered</p>`}</div>`).join("")}</div>
    <div class="row"><button class="btn primary" id="closeR">Back to the game</button></div>`);
  $("closeR").onclick=closeModal;
}
renderPlots(); showSetup();
</script>
</body>
</html>
